        X-Datadog-Hostname: ${env:DD_HOSTNAME}
        X-Datadog-AgentDefaultEnv: ddot-poc
        X-Datadog-Additional-Tags: host:${env:DD_HOSTNAME},default_env:ddot-poc,env:ddot-poc
      remove_headers:
      - Authorization
      - DD-APPLICATION-KEY
      - Cookie
      - X-Datadog-EVP-Subdomain
      - X-Datadog-NeedsAppKey
      - X-Forwarded-For
      - X-Forwarded-Host
      - X-Forwarded-Proto
