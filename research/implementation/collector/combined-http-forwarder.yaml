receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 768
    spike_limit_mib: 192
  resource/poc:
    attributes:
    - key: deployment.environment.name
      value: ddot-poc
      action: upsert
    - key: host.name
      value: ${env:DD_HOSTNAME}
      action: insert
  batch:
    timeout: 2s
    send_batch_size: 512
exporters:
  otlp_http/datadog:
    endpoint: https://otlp.${env:DD_SITE}
    headers:
      dd-api-key: ${env:DD_API_KEY}
      dd-otel-config: '{"traces":{"compute_stats":true}}'
  debug:
    verbosity: basic
service:
  telemetry:
    logs:
      level: debug
    metrics:
      readers:
      - pull:
          exporter:
            prometheus:
              host: 0.0.0.0
              port: 8888
  extensions:
  - health_check
  - http_forwarder
  pipelines:
    traces:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - resource/poc
      - batch
      exporters:
      - otlp_http/datadog
      - debug
    metrics:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - resource/poc
      - batch
      exporters:
      - otlp_http/datadog
      - debug
    logs:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - resource/poc
      - batch
      exporters:
      - otlp_http/datadog
      - debug
