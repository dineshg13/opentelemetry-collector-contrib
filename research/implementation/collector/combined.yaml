extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  datadog:
    api:
      site: ${env:DD_SITE}
      key: ${env:DD_API_KEY}
    hostname: ${env:DD_HOSTNAME}
    product_proxy:
      endpoint: 0.0.0.0:8126
      transport: tcp
      default_env: ddot-poc
      tags:
      - env:ddot-poc
    products:
      continuous_profiling:
        enabled: true
      data_streams_monitoring:
        enabled: true
      data_jobs_monitoring:
        enabled: true
      llm_observability:
        enabled: true
      ci_visibility:
        enabled: true
      live_debugging:
        enabled: true
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  postgresql/dbm:
    endpoint: dbm-postgres.ddot-poc.svc.cluster.local:5432
    username: dbm_monitor
    password: ${env:DBM_POSTGRES_PASSWORD}
    databases:
    - dbm
    collection_interval: 2s
    tls:
      insecure: true
    events:
      db.server.query_sample:
        enabled: true
      db.server.top_query:
        enabled: true
    top_query_collection:
      collection_interval: 10s
      max_explain_each_interval: 0
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 768
    spike_limit_mib: 192
  resource/poc:
    attributes:
    - key: deployment.environment.name
      value: ddot-poc
      action: upsert
    - key: host.name
      value: ${env:DD_HOSTNAME}
      action: insert
  batch:
    timeout: 2s
    send_batch_size: 512
exporters:
  otlp_http/datadog:
    endpoint: https://otlp.${env:DD_SITE}
    headers:
      dd-api-key: ${env:DD_API_KEY}
      dd-otel-config: '{"traces":{"compute_stats":true}}'
  debug:
    verbosity: detailed
service:
  telemetry:
    logs:
      level: debug
    metrics:
      readers:
      - pull:
          exporter:
            prometheus:
              host: 0.0.0.0
              port: 8888
  extensions:
  - health_check
  - datadog
  pipelines:
    traces:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - resource/poc
      - batch
      exporters:
      - otlp_http/datadog
      - debug
    metrics:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - resource/poc
      - batch
      exporters:
      - otlp_http/datadog
      - debug
    logs:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - resource/poc
      - batch
      exporters:
      - otlp_http/datadog
      - debug
    metrics/dbm:
      receivers:
      - postgresql/dbm
      processors:
      - resource/poc
      - batch
      exporters:
      - otlp_http/datadog
      - debug
    logs/dbm:
      receivers:
      - postgresql/dbm
      processors:
      - resource/poc
      - batch
      exporters:
      - otlp_http/datadog
      - debug
