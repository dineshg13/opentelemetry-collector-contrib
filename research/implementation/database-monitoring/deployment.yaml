apiVersion: v1
kind: ConfigMap
metadata:
  name: dbm-postgres-init
  namespace: ddot-poc
data:
  01-init.sh: |
    #!/bin/sh
    set -eu
    psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --set=ON_ERROR_STOP=1 --set=monitor_password="$POSTGRES_PASSWORD" <<'SQL'
    CREATE ROLE dbm_monitor LOGIN PASSWORD :'monitor_password';
    GRANT pg_monitor TO dbm_monitor;
    CREATE ROLE dbm_app LOGIN PASSWORD :'monitor_password';
    GRANT CONNECT ON DATABASE dbm TO dbm_app;
    CREATE EXTENSION pg_stat_statements;
    SQL
    psql --username "$POSTGRES_USER" --dbname postgres --set=ON_ERROR_STOP=1 -c 'CREATE EXTENSION pg_stat_statements;'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbm-postgres
  namespace: ddot-poc
  labels:
    app.kubernetes.io/part-of: ddot-products-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dbm-postgres
  template:
    metadata:
      labels:
        app: dbm-postgres
        app.kubernetes.io/part-of: ddot-products-poc
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: Never
          args: [postgres, -c, shared_preload_libraries=pg_stat_statements, -c, track_activity_query_size=4096]
          env:
            - name: POSTGRES_DB
              value: dbm
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dbm-postgres-password
                  key: password
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres, -d, dbm]
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          emptyDir: {}
        - name: init
          configMap:
            name: dbm-postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: dbm-postgres
  namespace: ddot-poc
spec:
  selector:
    app: dbm-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbm-python
  namespace: ddot-poc
  labels:
    app.kubernetes.io/part-of: ddot-products-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dbm-python
  template:
    metadata:
      labels:
        app: dbm-python
        app.kubernetes.io/part-of: ddot-products-poc
    spec:
      containers:
        - name: workload
          image: ddot-dbm-python:poc
          imagePullPolicy: Never
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dbm-postgres-password
                  key: password
            - name: DD_SERVICE
              value: ddot-dbm-python
            - name: DD_ENV
              value: ddot-poc
            - name: DD_VERSION
              value: "1"
            - name: DD_DBM_PROPAGATION_MODE
              value: full
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://collector.ddot-poc.svc.cluster.local:4318/v1/traces
            - name: OTEL_EXPORTER_OTLP_TRACES_PROTOCOL
              value: http/json
            - name: DD_INSTRUMENTATION_TELEMETRY_ENABLED
              value: "false"
            - name: DD_REMOTE_CONFIGURATION_ENABLED
              value: "false"
            - name: DD_TRACE_SAMPLE_RATE
              value: "1"
          ports:
            - containerPort: 8080
              name: health
          readinessProbe:
            httpGet:
              port: health
              path: /
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
