extensions:
  health_check:
    endpoint: 0.0.0.0:13133
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
  postgresql/dbm:
    endpoint: postgres:5432
    username: dbm_monitor
    password: ${env:DBM_POSTGRES_PASSWORD}
    databases: [dbm]
    collection_interval: 5s
    tls:
      insecure: true
    query_monitoring:
      enabled: true
      max_rows: 10000
      max_payload_bytes: 1048576
      query_plans:
        enabled: true
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  resource/database:
    attributes:
      - key: service.instance.id
        value: postgres.dbm-otlp-dev.svc.cluster.local:5432
        action: upsert
      - key: service.name
        value: dbm-otlp-dev-postgres
        action: upsert
      - key: deployment.environment.name
        value: dbm-otlp-dev
        action: upsert
  batch:
    timeout: 2s
exporters:
  otlp_http/intake:
    endpoint: https://otlp.${env:DD_SITE}
    headers:
      dd-api-key: ${env:DD_API_KEY}
      dd-otel-config: '{"traces":{"compute_stats":true}}'
      dd-otel-log-config: '{"keep_raw_dbm_logs":true}'
    retry_on_failure:
      enabled: true
      max_elapsed_time: 5m
  debug/dbm:
    # Only this isolated synthetic database is logged for local verification.
    verbosity: detailed
service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    logs/dbm:
      receivers: [postgresql/dbm]
      processors: [memory_limiter, resource/database, batch]
      exporters: [otlp_http/intake, debug/dbm]
    metrics/postgres:
      receivers: [postgresql/dbm]
      processors: [memory_limiter, resource/database, batch]
      exporters: [otlp_http/intake]
    traces/workload:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/intake]
