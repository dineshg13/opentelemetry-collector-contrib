# ConfigMaps refreshed from collector/combined*.yaml by scripts/deploy-collectors.py.
apiVersion: v1
kind: ConfigMap
metadata:
  name: collector
  namespace: ddot-poc
data:
  collector.yaml: "# Copyright The OpenTelemetry Authors\n# SPDX-License-Identifier:\
    \ Apache-2.0\nextensions:\n  health_check:\n    endpoint: 0.0.0.0:13133\n  datadog:\n\
    \    api:\n      site: ${env:DD_SITE}\n      key: ${env:DD_API_KEY}\n    hostname:\
    \ ${env:DD_HOSTNAME}\n    product_proxy:\n      endpoint: 0.0.0.0:8126\n     \
    \ transport: tcp\n      default_env: ddot-poc\n      tags:\n      - env:ddot-poc\n\
    \    products:\n      continuous_profiling:\n        enabled: true\n      data_streams_monitoring:\n\
    \        enabled: true\n      data_jobs_monitoring:\n        enabled: true\n \
    \     llm_observability:\n        enabled: true\n      ci_visibility:\n      \
    \  enabled: true\n      live_debugging:\n        enabled: true\nreceivers:\n \
    \ otlp:\n    protocols:\n      grpc:\n        endpoint: 0.0.0.0:4317\n      http:\n\
    \        endpoint: 0.0.0.0:4318\n  postgresql/dbm:\n    endpoint: dbm-postgres.ddot-poc.svc.cluster.local:5432\n\
    \    username: dbm_monitor\n    password: ${env:DBM_POSTGRES_PASSWORD}\n    databases:\n\
    \    - dbm\n    collection_interval: 2s\n    tls:\n      insecure: true\n    events:\n\
    \      db.server.query_sample:\n        enabled: true\n      db.server.top_query:\n\
    \        enabled: true\n    top_query_collection:\n      collection_interval:\
    \ 10s\n      max_explain_each_interval: 0\nprocessors:\n  memory_limiter:\n  \
    \  check_interval: 1s\n    limit_mib: 768\n    spike_limit_mib: 192\n  resource/poc:\n\
    \    attributes:\n    - key: deployment.environment.name\n      value: ddot-poc\n\
    \      action: upsert\n    - key: host.name\n      value: ${env:DD_HOSTNAME}\n\
    \      action: insert\n  batch:\n    timeout: 2s\n    send_batch_size: 512\nexporters:\n\
    \  otlp_http/datadog:\n    endpoint: https://otlp.${env:DD_SITE}\n    headers:\n\
    \      dd-api-key: ${env:DD_API_KEY}\n      dd-otel-config: '{\"traces\":{\"compute_stats\"\
    :true}}'\n  debug:\n    verbosity: detailed\nservice:\n  telemetry:\n    logs:\n\
    \      level: debug\n    metrics:\n      readers:\n      - pull:\n          exporter:\n\
    \            prometheus:\n              host: 0.0.0.0\n              port: 8888\n\
    \  extensions:\n  - health_check\n  - datadog\n  pipelines:\n    traces:\n   \
    \   receivers:\n      - otlp\n      processors:\n      - memory_limiter\n    \
    \  - resource/poc\n      - batch\n      exporters:\n      - otlp_http/datadog\n\
    \      - debug\n    metrics:\n      receivers:\n      - otlp\n      processors:\n\
    \      - memory_limiter\n      - resource/poc\n      - batch\n      exporters:\n\
    \      - otlp_http/datadog\n      - debug\n    logs:\n      receivers:\n     \
    \ - otlp\n      processors:\n      - memory_limiter\n      - resource/poc\n  \
    \    - batch\n      exporters:\n      - otlp_http/datadog\n      - debug\n   \
    \ metrics/dbm:\n      receivers:\n      - postgresql/dbm\n      processors:\n\
    \      - resource/poc\n      - batch\n      exporters:\n      - otlp_http/datadog\n\
    \      - debug\n    logs/dbm:\n      receivers:\n      - postgresql/dbm\n    \
    \  processors:\n      - resource/poc\n      - batch\n      exporters:\n      -\
    \ otlp_http/datadog\n      - debug\n"
---
apiVersion: v1
kind: Service
metadata:
  name: collector
  namespace: ddot-poc
  labels:
    app: collector
    app.kubernetes.io/part-of: ddot-products-poc
spec:
  selector:
    app: collector
  ports:
  - name: otlp-grpc
    port: 4317
    targetPort: otlp-grpc
  - name: otlp-http
    port: 4318
    targetPort: otlp-http
  - name: products
    port: 8126
    targetPort: products
  - name: health
    port: 13133
    targetPort: health
  - name: metrics
    port: 8888
    targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: ddot-poc
  labels: &id001
    app: collector
    app.kubernetes.io/part-of: ddot-products-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels: *id001
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
      - name: collector
        image: ddot-products-collector:poc
        imagePullPolicy: Never
        env:
        - name: DD_SITE
          value: us5.datadoghq.com
        - name: DD_API_KEY
          valueFrom:
            secretKeyRef:
              name: datadog-api-key
              key: api-key
        - name: DD_HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: DBM_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dbm-postgres-password
              key: password
        ports:
        - name: otlp-grpc
          containerPort: 4317
        - name: otlp-http
          containerPort: 4318
        - name: products
          containerPort: 8126
        - name: health
          containerPort: 13133
        - name: metrics
          containerPort: 8888
        readinessProbe:
          httpGet:
            path: /
            port: health
          initialDelaySeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: health
          initialDelaySeconds: 15
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /conf
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: collector
---
