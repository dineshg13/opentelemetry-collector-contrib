# ConfigMaps refreshed from collector/combined*.yaml by scripts/deploy-collectors.py.
apiVersion: v1
kind: ConfigMap
metadata:
  name: collector
  namespace: ddot-poc
data:
  collector.yaml: |
    # Copyright The OpenTelemetry Authors
    # SPDX-License-Identifier: Apache-2.0
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      datadog:
        api:
          site: ${env:DD_SITE}
          key: ${env:DD_API_KEY}
        hostname: ${env:DD_HOSTNAME}
        product_proxy:
          endpoint: 0.0.0.0:8126
          transport: tcp
          default_env: ddot-poc
          tags:
          - env:ddot-poc
        products:
          continuous_profiling:
            enabled: true
          data_streams_monitoring:
            enabled: true
          data_jobs_monitoring:
            enabled: true
          llm_observability:
            enabled: true
          ci_visibility:
            enabled: true
          live_debugging:
            enabled: true
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      postgresql/dbm:
        endpoint: dbm-postgres.ddot-poc.svc.cluster.local:5432
        username: dbm_monitor
        password: ${env:DBM_POSTGRES_PASSWORD}
        databases:
        - dbm
        collection_interval: 2s
        tls:
          insecure: true
        events:
          db.server.query_sample:
            enabled: true
          db.server.top_query:
            enabled: true
        top_query_collection:
          collection_interval: 10s
          max_explain_each_interval: 0
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 768
        spike_limit_mib: 192
      resource/poc:
        attributes:
        - key: deployment.environment.name
          value: ddot-poc
          action: upsert
        - key: host.name
          value: ${env:DD_HOSTNAME}
          action: insert
      batch:
        timeout: 2s
        send_batch_size: 512
    exporters:
      otlp_http/datadog:
        endpoint: https://otlp.${env:DD_SITE}
        headers:
          dd-api-key: ${env:DD_API_KEY}
          dd-otel-config: '{"traces":{"compute_stats":true}}'
      debug:
        verbosity: basic
    service:
      telemetry:
        logs:
          level: debug
          sampling:
            enabled: false
        metrics:
          readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888
      extensions:
      - health_check
      - datadog
      pipelines:
        traces:
          receivers:
          - otlp
          processors:
          - memory_limiter
          - resource/poc
          - batch
          exporters:
          - otlp_http/datadog
          - debug
        metrics:
          receivers:
          - otlp
          processors:
          - memory_limiter
          - resource/poc
          - batch
          exporters:
          - otlp_http/datadog
          - debug
        logs:
          receivers:
          - otlp
          processors:
          - memory_limiter
          - resource/poc
          - batch
          exporters:
          - otlp_http/datadog
          - debug
        metrics/dbm:
          receivers:
          - postgresql/dbm
          processors:
          - resource/poc
          - batch
          exporters:
          - otlp_http/datadog
          - debug
        logs/dbm:
          receivers:
          - postgresql/dbm
          processors:
          - resource/poc
          - batch
          exporters:
          - otlp_http/datadog
          - debug
---
apiVersion: v1
kind: Service
metadata:
  name: collector
  namespace: ddot-poc
  labels:
    app: collector
    app.kubernetes.io/part-of: ddot-products-poc
spec:
  selector:
    app: collector
  ports:
  - name: otlp-grpc
    port: 4317
    targetPort: otlp-grpc
  - name: otlp-http
    port: 4318
    targetPort: otlp-http
  - name: products
    port: 8126
    targetPort: products
  - name: health
    port: 13133
    targetPort: health
  - name: metrics
    port: 8888
    targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: ddot-poc
  labels: &id001
    app: collector
    app.kubernetes.io/part-of: ddot-products-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels: *id001
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
      - name: collector
        image: ddot-products-collector:poc
        imagePullPolicy: Never
        env:
        - name: DD_SITE
          value: us5.datadoghq.com
        - name: DD_API_KEY
          valueFrom:
            secretKeyRef:
              name: datadog-api-key
              key: api-key
        - name: DD_HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: DBM_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dbm-postgres-password
              key: password
        ports:
        - name: otlp-grpc
          containerPort: 4317
        - name: otlp-http
          containerPort: 4318
        - name: products
          containerPort: 8126
        - name: health
          containerPort: 13133
        - name: metrics
          containerPort: 8888
        readinessProbe:
          httpGet:
            path: /
            port: health
          initialDelaySeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: health
          initialDelaySeconds: 15
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /conf
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: collector
      nodeSelector:
        kubernetes.io/hostname: otel-dd-worker
---
