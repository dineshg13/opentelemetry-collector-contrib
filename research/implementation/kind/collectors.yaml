---
apiVersion: v1
kind: Service
metadata:
  name: collector-http-forwarder
  namespace: ddot-poc
  labels:
    app: collector-http-forwarder
    app.kubernetes.io/part-of: ddot-products-poc
spec:
  selector:
    app: collector-http-forwarder
  ports:
  - name: otlp-grpc
    port: 4317
    targetPort: otlp-grpc
  - name: otlp-http
    port: 4318
    targetPort: otlp-http
  - name: products
    port: 8126
    targetPort: products
  - name: health
    port: 13133
    targetPort: health
  - name: metrics
    port: 8888
    targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector-http-forwarder
  namespace: ddot-poc
  labels: &id001
    app: collector-http-forwarder
    app.kubernetes.io/part-of: ddot-products-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collector-http-forwarder
  template:
    metadata:
      labels: *id001
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
      - name: collector
        image: ddot-products-collector:poc
        imagePullPolicy: Never
        env:
        - name: DD_SITE
          value: us5.datadoghq.com
        - name: DD_API_KEY
          valueFrom:
            secretKeyRef:
              name: datadog-api-key
              key: api-key
        - name: DD_HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        ports:
        - name: otlp-grpc
          containerPort: 4317
        - name: otlp-http
          containerPort: 4318
        - name: products
          containerPort: 8126
        - name: health
          containerPort: 13133
        - name: metrics
          containerPort: 8888
        readinessProbe:
          httpGet:
            path: /
            port: health
          initialDelaySeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: health
          initialDelaySeconds: 15
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /conf
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: collector-http-forwarder
