extensions:
  datadog:
    api:
      site: ${env:DD_SITE}
      key: ${env:DD_API_KEY}
    hostname: ${env:DD_HOSTNAME}
    product_proxy:
      endpoint: 0.0.0.0:8126
      transport: tcp
      default_env: ddot-poc
      tags:
      - env:ddot-poc
    products:
      live_debugging:
        enabled: false
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
exporters:
  otlp_http/datadog:
    endpoint: https://otlp.${env:DD_SITE}
    headers:
      dd-api-key: ${env:DD_API_KEY}
service:
  pipelines:
    traces:
      receivers:
      - otlp
      exporters:
      - otlp_http/datadog
  extensions:
  - datadog
